<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>KI-Agent</title>
    <link rel="manifest" href="/static/manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f0f1a;
            --surface: #1a1a2e;
            --surface2: #252540;
            --primary: #6c63ff;
            --primary-dark: #5a52d5;
            --text: #e8e8f0;
            --text-dim: #8888aa;
            --user-bg: #6c63ff;
            --agent-bg: #252540;
            --border: #333355;
            --danger: #ff6b6b;
            --success: #51cf66;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            font-size: 16px;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Header */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        #header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        #header .status {
            font-size: 12px;
            color: var(--success);
        }

        /* Chat Messages */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
            font-size: 15px;
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-bg);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: var(--agent-bg);
            border-bottom-left-radius: 4px;
        }

        .message .time {
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            text-align: right;
        }

        .message.assistant .time {
            color: var(--text-dim);
        }

        /* Typing indicator */
        .typing {
            align-self: flex-start;
            background: var(--agent-bg);
            padding: 12px 18px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--text-dim);
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing span:nth-child(1) { animation-delay: -0.32s; }
        .typing span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Quick Actions */
        #quick-actions {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            overflow-x: auto;
            flex-shrink: 0;
            -webkit-overflow-scrolling: touch;
        }

        #quick-actions::-webkit-scrollbar { display: none; }

        .quick-btn {
            flex-shrink: 0;
            padding: 6px 14px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .quick-btn:hover, .quick-btn:active {
            background: var(--primary-dark);
            border-color: var(--primary);
        }

        /* Input Area */
        #input-area {
            display: flex;
            gap: 8px;
            padding: 12px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }

        #message-input {
            flex: 1;
            padding: 10px 16px;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
        }

        #message-input::placeholder {
            color: var(--text-dim);
        }

        #message-input:focus {
            border-color: var(--primary);
        }

        #send-btn {
            width: 44px;
            height: 44px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: var(--primary-dark);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Scrollbar */
        #messages::-webkit-scrollbar { width: 4px; }
        #messages::-webkit-scrollbar-track { background: transparent; }
        #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>
    <div id="app">
        <div id="header">
            <h1 id="agent-name">KI-Agent</h1>
            <span class="status">Online</span>
        </div>

        <div id="messages"></div>

        <div id="quick-actions">
            <button class="quick-btn" onclick="sendQuick('Was steht heute an?')">Heute</button>
            <button class="quick-btn" onclick="sendQuick('Zeig mir meine Ziele')">Ziele</button>
            <button class="quick-btn" onclick="sendQuick('Welche Commitments habe ich offen?')">Commitments</button>
            <button class="quick-btn" onclick="sendQuick('Was weisst du ueber mich?')">Profil</button>
        </div>

        <div id="input-area">
            <textarea id="message-input" rows="1" placeholder="Nachricht schreiben..."
                      onkeydown="handleKeydown(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()" title="Senden">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        let isLoading = false;

        // Auto-resize textarea
        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
        });

        function handleKeydown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function addMessage(content, role) {
            const div = document.createElement('div');
            div.className = `message ${role}`;

            const time = new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${escapeHtml(content)}<div class="time">${time}</div>`;

            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typing-indicator';
            div.innerHTML = '<span></span><span></span><span></span>';
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideTyping() {
            const el = document.getElementById('typing-indicator');
            if (el) el.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message || isLoading) return;

            isLoading = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addMessage(message, 'user');
            showTyping();

            try {
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });

                hideTyping();

                if (res.ok) {
                    const data = await res.json();
                    addMessage(data.response, 'assistant');
                } else {
                    addMessage('Fehler bei der Verbindung zum Server.', 'assistant');
                }
            } catch (err) {
                hideTyping();
                addMessage('Server nicht erreichbar. Bitte spaeter erneut versuchen.', 'assistant');
            }

            isLoading = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }

        function sendQuick(text) {
            inputEl.value = text;
            sendMessage();
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .then(() => console.log('Service Worker registered'))
                .catch(err => console.log('SW registration failed:', err));
        }

        // Welcome message
        addMessage('Hallo! Ich bin dein persoenlicher KI-Agent. Wie kann ich dir helfen?', 'assistant');

        inputEl.focus();
    </script>
</body>
</html>
