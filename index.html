<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2d5a1b">
    <title>Ameisensimulator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/images/queen.png">
    <link rel="apple-touch-icon" href="assets/images/queen.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #1a3a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #8fbc5a;
            font-family: monospace;
            font-size: 18px;
            z-index: 100;
        }

        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #3a5a2a;
            border-top-color: #8fbc5a;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Ameisensimulator wird geladen...</div>
    </div>
    <canvas id="game"></canvas>
    <script src="game.js?v=14"></script>
</body>
</html>
